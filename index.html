<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatApp</title>
<style>
:root{--g:#008069;--bg:#efeae2;--me:#d9fdd3;--line:#e9edef}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;height:100vh;height:100dvh;background:#f0f2f5}
button,input{font:inherit}
.btn{background:var(--g);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
.btn.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
#auth{max-width:340px;margin:8vh auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002}
#auth input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
#auth .row{display:flex;gap:8px;margin-top:8px}#auth .row button{flex:1}
#err{color:#c00;min-height:1.2em;font-size:13px}
#app{display:none;height:100%;grid-template-columns:340px 1fr}
#side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{background:#f0f2f5;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top small{color:#667781;display:block}
#list{overflow:auto;flex:1}
.chat{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.chat:hover,.chat.on{background:#f5f6f6}
.av{width:42px;height:42px;border-radius:50%;background:#dfe5e7;display:grid;place-items:center;font-weight:600;color:#54656f;flex:none}
.chat .mid{flex:1;min-width:0}.chat .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .mid .sub{color:#667781;font-size:13px}
.badge{background:#25d366;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
#main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#empty{margin:auto;color:#667781}
#pane{display:none;flex-direction:column;height:100%;min-height:0}
#head{background:#f0f2f5;padding:10px 12px;display:flex;gap:10px;align-items:center}
#back{display:none;background:none;border:0;font-size:20px}
#msgs{flex:1;overflow:auto;padding:12px 8%;display:flex;flex-direction:column;gap:4px}
.m{max-width:75%;padding:6px 9px;border-radius:8px;background:#fff;align-self:flex-start;word-wrap:break-word;box-shadow:0 1px 1px #0002}
.m.me{background:var(--me);align-self:flex-end}
.m .who{font-size:12px;color:var(--g);font-weight:600}
.m img{max-width:100%;border-radius:6px;display:block}
.m .t{font-size:11px;color:#667781;text-align:right;margin-top:2px}
.tick.read{color:#53bdeb}
#bar{display:flex;gap:8px;padding:10px;background:#f0f2f5;align-items:center}
#bar input[type=text]{flex:1;padding:10px 14px;border:0;border-radius:20px}
#bar label{cursor:pointer;font-size:20px}
@media(max-width:700px){
 #app{grid-template-columns:1fr}#main{display:none}
 #app.open #side{display:none}#app.open #main{display:flex}
 #back{display:block}#msgs{padding:12px}}
</style></head><body>
<div id="auth">
 <h2 style="margin-top:0;color:var(--g)">ChatApp</h2>
 <input id="name" placeholder="Your name (sign up only)">
 <input id="num" placeholder="Your number (log in only)" inputmode="numeric">
 <input id="pw" type="password" placeholder="Password (6+ characters)">
 <div id="err"></div>
 <div class="row"><button class="btn" onclick="authGo('login')">Log in</button><button class="btn alt" onclick="authGo('signup')">Sign up</button></div>
 <p style="font-size:12px;color:#667781">Signing up allocates you a unique number. Friends use it to message you.</p>
</div>
<div id="app">
 <div id="side">
  <div class="top"><div><b id="meName"></b><small id="meNum"></small></div>
   <div><button class="btn" onclick="newChat()">+ Chat</button> <button class="btn alt" onclick="newGroup()">Group</button></div></div>
  <div id="list"></div>
 </div>
 <div id="main">
  <div id="empty">Select a chat or start one with a number</div>
  <div id="pane">
   <div id="head"><button id="back" onclick="closeChat()">←</button><div class="av" id="hav"></div><div><b id="hname"></b><small id="hsub" style="display:block;color:#667781"></small></div></div>
   <div id="msgs"></div>
   <div id="bar"><label>📎<input type="file" id="file" hidden onchange="sendFile(this)"></label>
    <input type="text" id="txt" placeholder="Type a message" autocomplete="off"><button class="btn" onclick="send()">Send</button></div>
  </div>
 </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
let token=localStorage.t,me,chats=[],cur=null,msgs={},sock,pres={},typingTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...o.headers}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d};
const time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const tick=s=>s==='read'?'<span class="tick read">✓✓</span>':s==='delivered'?'<span class="tick">✓✓</span>':'<span class="tick">✓</span>';

async function authGo(kind){
  try{const d=await api(kind,{method:'POST',body:JSON.stringify({name:$('#name').value,number:$('#num').value,password:$('#pw').value})});
   token=d.token;localStorage.t=token;me=d.user;
   if(kind==='signup')alert('Your number is '+d.user.number+'. Share it so people can message you!');
   start();}catch(e){$('#err').textContent=e.message}
}
function logout(){localStorage.removeItem('t');location.reload()}
async function init(){if(!token)return;try{me=await api('me');start()}catch{localStorage.removeItem('t')}}
function start(){
  $('#auth').style.display='none';$('#app').style.display='grid';
  $('#meName').textContent=me.name;$('#meNum').innerHTML='Your number: '+esc(me.number)+' · <a href="#" onclick="logout()">log out</a>';
  sock=io({auth:{token}});
  sock.on('message',m=>{
    if(msgs[m.chat])msgs[m.chat].push(m);
    if(cur===m.chat){renderMsgs();if(m.from!==me.number)sock.emit('read',{chat:cur})}
    loadChats();
  });
  sock.on('status',({id,chat,status})=>{const m=(msgs[chat]||[]).find(x=>x.id===id);if(m){m.status=status;if(cur===chat)renderMsgs()}loadChats()});
  sock.on('typing',({chat,name})=>{if(chat!==cur)return;$('#hsub').textContent=name+' is typing…';clearTimeout(typingTimer);typingTimer=setTimeout(setSub,1500)});
  sock.on('presence',p=>{pres[p.number]=p;setSub();loadChats()});
  sock.on('chats-changed',loadChats);
  loadChats();
}
async function loadChats(){chats=await api('chats');renderList()}
function renderList(){
  $('#list').innerHTML=chats.map(c=>`<div class="chat ${c.id===cur?'on':''}" onclick="openChat('${c.id}')">
   <div class="av">${esc((c.name||'?')[0].toUpperCase())}</div>
   <div class="mid"><div><b>${esc(c.name)}</b></div><div class="sub">${c.last?(c.last.from===me.number?tick(c.last.status)+' ':'')+esc(c.last.text||'📎 Attachment'):'No messages yet'}</div></div>
   ${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>`).join('')||'<p style="padding:16px;color:#667781">No chats yet. Tap “+ Chat” and enter a number.</p>';
}
function chatInfo(id){return chats.find(c=>c.id===id)}
function setSub(){
  const c=chatInfo(cur);if(!c)return;
  if(c.group){$('#hsub').textContent=c.members.length+' members';return}
  const p=pres[c.number];const on=p?p.online:c.online;
  $('#hsub').textContent=on?'online':'+'+c.number;
}
async function openChat(id){
  cur=id;$('#empty').style.display='none';$('#pane').style.display='flex';$('#app').classList.add('open');
  const c=chatInfo(id);$('#hname').textContent=c.name;$('#hav').textContent=c.name[0].toUpperCase();setSub();
  msgs[id]=await api('messages?chat='+encodeURIComponent(id));
  renderMsgs();sock.emit('read',{chat:id});
  const ch=chats.find(x=>x.id===id);if(ch)ch.unread=0;renderList();$('#txt').focus();
}
function closeChat(){cur=null;$('#app').classList.remove('open');$('#pane').style.display='none';$('#empty').style.display='';renderList()}
function renderMsgs(){
  const c=chatInfo(cur),box=$('#msgs');
  box.innerHTML=(msgs[cur]||[]).map(m=>{
    const mine=m.from===me.number;
    const f=m.file?(m.file.type?.startsWith('image/')?`<img src="${esc(m.file.url)}">`:`<a href="${esc(m.file.url)}" target="_blank">📄 ${esc(m.file.name)}</a>`):'';
    return `<div class="m ${mine?'me':''}">${c?.group&&!mine?`<div class="who">+${esc(m.from)}</div>`:''}${f}${m.text?`<div>${esc(m.text)}</div>`:''}<div class="t">${time(m.ts)} ${mine?tick(m.status):''}</div></div>`}).join('');
  box.scrollTop=box.scrollHeight;
}
function send(file){
  const text=$('#txt').value.trim();if(!cur||(!text&&!file))return;
  sock.emit('send',{chat:cur,text:file?'':text,file:file||null},r=>{if(r?.error)alert(r.error)});$('#txt').value='';
}
async function sendFile(inp){
  const f=inp.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
  try{const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});send(await r.json())}catch{alert('Upload failed')}
  inp.value='';
}
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('#txt').addEventListener('input',()=>cur&&sock.emit('typing',{chat:cur}));
async function newChat(){
  const n=(prompt('Enter their number:')||'').replace(/\D/g,'');if(!n)return;
  if(n===me.number)return alert('That is your own number');
  try{const u=await api('users/'+n);const id=['dm',...[me.number,n].sort()].join(':');
   if(!chatInfo(id))chats.unshift({id,name:u.name,number:n,online:u.online,unread:0});openChat(id)}catch(e){alert(e.message)}
}
async function newGroup(){
  const name=prompt('Group name:');if(!name)return;
  const nums=(prompt('Member numbers, comma-separated:')||'').split(',').map(s=>s.trim()).filter(Boolean);
  try{const g=await api('groups',{method:'POST',body:JSON.stringify({name,members:nums})});await loadChats();openChat(g.id)}catch(e){alert(e.message)}
}
init();
</script></body></html>
