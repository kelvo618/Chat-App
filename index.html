<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<title>PHANTOM LINK</title>
<style>
:root{color-scheme:dark;--g:#2f80ff;--p:#b44dff;--bg:#070816;--me:#2358d6;--line:#1b1f3a;--panel:#0d0f22;--bar:#12142b;--txt:#eef0ff;--sub:#8b90b8;--in:#171a35}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;height:100vh;height:100dvh;background:var(--bar);color:var(--txt)}
button,input{font:inherit;color:inherit}
input{background:var(--in)}
a{color:var(--g)}
.btn{background:var(--g);color:#fff;border:0;padding:9px 13px;border-radius:8px;cursor:pointer}
.btn.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
.ico{background:none;border:0;font-size:19px;cursor:pointer;padding:4px 6px}
#auth{max-width:340px;margin:7vh auto;background:var(--panel);padding:24px;border-radius:12px;box-shadow:0 2px 10px #0003;text-align:center}
#auth img{width:84px;height:84px;border-radius:20px}
#auth input{width:100%;padding:10px;margin:6px 0;border:1px solid #8884;border-radius:8px}
#auth .row{display:flex;gap:8px;margin-top:8px}#auth .row button{flex:1}
#err{color:#e33;min-height:1.2em;font-size:13px}
#app{display:none;height:100%;grid-template-columns:350px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{background:var(--bar);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top small{color:var(--sub);display:block}
.top .me{display:flex;gap:8px;align-items:center}.top .me img{width:34px;height:34px;border-radius:8px}
#q{margin:8px 12px;padding:8px 12px;border:0;border-radius:8px;background:var(--bar)}
#list{overflow:auto;flex:1}
.chat{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.chat:hover,.chat.on{background:var(--bar)}
.av{width:42px;height:42px;border-radius:50%;background:#8884;display:grid;place-items:center;font-weight:600;flex:none}
.chat .mid{flex:1;min-width:0}.chat .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--sub);font-size:13px}
.badge{background:#25d366;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
#main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#empty{margin:auto;color:var(--sub);text-align:center}#empty img{width:96px;opacity:.9;border-radius:22px}
#pane{display:none;flex-direction:column;height:100%;min-height:0}
#head{background:var(--bar);padding:10px 12px;display:flex;gap:10px;align-items:center}
#back{display:none}
#msgs{flex:1;overflow:auto;padding:12px 8%;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;background:var(--panel);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0}
.m{position:relative;max-width:75%;padding:6px 9px;border-radius:8px;background:var(--in);align-self:flex-start;word-wrap:break-word;box-shadow:0 1px 1px #0002}
.m.me{background:var(--me);align-self:flex-end}
.m .who{font-size:12px;color:var(--g);font-weight:600}
.m img.pic{max-width:100%;border-radius:6px;display:block}
.m audio{max-width:230px;height:36px}
.m .t{font-size:11px;color:var(--sub);text-align:right;margin-top:2px}
.m .q{border-left:3px solid var(--g);background:#8882;border-radius:4px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--sub)}
.m.del{font-style:italic;color:var(--sub)}
.act{position:absolute;top:-13px;right:6px;display:none;background:var(--panel);border-radius:12px;box-shadow:0 1px 4px #0004;padding:0 4px;font-size:13px}
.m:hover .act{display:block}.act span{cursor:pointer;padding:2px 4px}
@media(hover:none){.act{display:block;opacity:.7}}
.tick.read{color:#53bdeb}
#replybar{display:none;background:var(--bar);padding:6px 12px;border-left:4px solid var(--g);font-size:13px;color:var(--sub);justify-content:space-between}
#emoji{display:none;background:var(--bar);padding:6px 10px;flex-wrap:wrap;gap:2px;max-height:130px;overflow:auto}
#emoji span{cursor:pointer;font-size:22px;padding:2px 4px}
#bar{display:flex;gap:6px;padding:10px;background:var(--bar);align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#bar input[type=text]{flex:1;padding:10px 14px;border:0;border-radius:20px}
#bar label{cursor:pointer;font-size:20px}
@media(max-width:700px){
 #app{grid-template-columns:minmax(0,1fr)}#main{display:none}
 #app.open #side{display:none}#app.open #main{display:flex}
 #back{display:block}#msgs{padding:12px}.m{max-width:88%}}

.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:110px;height:110px;font-size:42px;margin:0 auto 8px}
#modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal .card{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:360px;max-height:90vh;overflow:auto}
#modal input{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #8884;border-radius:8px}
#modal .row{display:flex;gap:8px}#modal .row button{flex:1}
#toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;max-width:90%;text-align:center}
#call{position:fixed;inset:0;background:#111b21;color:#fff;display:none;flex-direction:column;align-items:center;z-index:50}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
#call.video #rv{opacity:1}
#lv{display:none;position:absolute;right:12px;top:12px;width:110px;height:150px;object-fit:cover;border-radius:10px;background:#000;z-index:2;transform:scaleX(-1)}
#call.video #lv{display:block}
#cinfo{position:relative;z-index:2;text-align:center;margin-top:15vh;margin-bottom:auto}
#call.video.on #cinfo{display:none}
#cinfo .av.big{background:#8886;color:#fff}
#cbtns{position:relative;z-index:2;display:flex;gap:18px;margin-bottom:8vh;padding-bottom:env(safe-area-inset-bottom)}
#cbtns button{width:62px;height:62px;border-radius:50%;border:0;font-size:26px;background:#ffffff30;color:#fff;cursor:pointer}
#cbtns .end{background:#e53935}#cbtns .acc{background:#25d366}

body{background:#05060f;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.btn{background:linear-gradient(135deg,var(--g),var(--p));box-shadow:0 0 14px #2f80ff44}
.btn.alt{background:transparent;color:#8fb8ff;border:1px solid #2f80ff88;box-shadow:none}
a{color:#8fb8ff}
.brand{margin:8px 0 2px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#4aa8ff,#b44dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;letter-spacing:3px;color:#8fb8ff;margin-bottom:10px}
.slogan{font-size:10px;letter-spacing:2px;color:#6d72a0;margin:6px 0 0}
#auth{background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,var(--g),var(--p)) border-box;border:1px solid transparent;box-shadow:0 0 40px #5b3bff33}
#auth img,#empty img{box-shadow:0 0 30px #7a4dff66}
.brandbar{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-weight:800;letter-spacing:3px;font-size:12px;color:#cfd3ff}
.brandbar img{width:24px;height:24px;border-radius:7px}
.chat:hover,.chat.on{background:#171a35}
.av{background:linear-gradient(135deg,#1d3a8a,#5b2bb3);color:#fff}
.badge{background:linear-gradient(135deg,var(--g),var(--p))}
#main{background:radial-gradient(circle at 15% 0%,#16164a66,transparent 55%),radial-gradient(circle at 95% 100%,#3a1a7a55,transparent 55%),var(--bg)}
.m{box-shadow:0 1px 6px #0006}
.m.me{background:linear-gradient(135deg,#2358d6,#7a3df0);color:#fff;box-shadow:0 0 14px #6a4cff44}
.m.me .t,.m.me .q{color:#dfe2ff}
.m .who{color:#c08aff}
.m .q{border-left-color:var(--p)}
.tick.read{color:#4de1ff}
.day{background:#171a35;color:#9aa0d0}
#head,.top,#bar,#replybar,#emoji{background:var(--bar)}
#call{background:radial-gradient(circle at 50% 0%,#1d2160,#05060f 70%)}
#side,#main,#pane{min-width:0}#bar input[type=text]{min-width:0}#head>div{min-width:0}#hname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div id="auth">
 <img src="/icon.svg" alt="PHANTOM LINK">
 <h2 class="brand">PHANTOM LINK</h2>
 <div class="tag">CONNECT WITHOUT LIMITS.</div>
 <input id="name" placeholder="Your name (sign up only)">
 <input id="num" placeholder="Your number (log in only)" inputmode="numeric">
 <input id="pw" type="password" placeholder="Password (6+ characters)">
 <div id="err"></div>
 <div class="row"><button class="btn" onclick="authGo('login')">Log in</button><button class="btn alt" onclick="authGo('signup')">Sign up</button></div>
 <p class="sub">Signing up allocates you a unique number. Friends use it to message you.</p>
 <p class="slogan">ONE NETWORK. ENDLESS CONNECTIONS.</p>
</div>
<div id="app">
 <div id="side">
  <div class="brandbar"><img src="/icon.svg" alt=""> PHANTOM LINK</div>
  <div class="top"><div class="me"><span id="meAv" onclick="editProfile()" style="cursor:pointer"></span><div><b id="meName"></b><small id="meNum"></small></div></div>
   <div><button class="ico" title="Profile" onclick="editProfile()">⚙️</button><button class="btn" onclick="newChat()">+ Chat</button> <button class="btn alt" onclick="newGroup()">Group</button></div></div>
  <input id="q" placeholder="Search chats" oninput="renderList()">
  <div id="list"></div>
 </div>
 <div id="main">
  <div id="empty"><img src="/icon.svg" alt=""><h3 class="brand">PHANTOM LINK</h3><p>Select a chat or start one with a number</p></div>
  <div id="pane">
   <div id="head"><button id="back" class="ico" onclick="closeChat()">←</button><div class="av" id="hav" onclick="showContact()" style="cursor:pointer"></div><div onclick="showContact()" style="cursor:pointer;min-width:0"><b id="hname"></b><small id="hsub" class="sub" style="display:block"></small></div><span id="calls" style="margin-left:auto;white-space:nowrap"><button class="ico" onclick="startCall(false)" title="Voice call">📞</button><button class="ico" onclick="startCall(true)" title="Video call">🎥</button></span></div>
   <div id="msgs"></div>
   <div id="replybar"><span id="replytxt"></span><span style="cursor:pointer" onclick="clearReply()">✕</span></div>
   <div id="emoji"></div>
   <div id="bar"><button class="ico" onclick="toggleEmoji()">😊</button>
    <label>📎<input type="file" id="file" hidden onchange="sendFile(this)"></label>
    <input type="text" id="txt" placeholder="Type a message" autocomplete="off">
    <button class="ico" id="mic" onclick="mic()">🎤</button><button class="btn" onclick="send()">Send</button></div>
  </div>
 </div>
</div>
<div id="call"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
 <div id="cinfo"><div class="av big" id="cav"></div><h2 id="cname" style="margin:6px 0"></h2><div id="cstat"></div></div>
 <div id="cbtns"><button id="cmute" onclick="toggleMute(this)">🎙️</button><button id="ccam" onclick="toggleCam(this)">📷</button><button id="cacc" class="acc" onclick="acceptCall()">📞</button><button class="end" onclick="hangup()">📵</button></div></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div><div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
let token=localStorage.t,me,chats=[],cur=null,msgs={},sock,pres={},typingTimer,replyId=null,rec,chunks=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...o.headers}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d};
const time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const tick=s=>s==='read'?'<span class="tick read">✓✓</span>':s==='delivered'?'<span class="tick">✓✓</span>':'<span class="tick">✓</span>';
const isAudio=f=>f?.type?.startsWith('audio/'),isImg=f=>f?.type?.startsWith('image/');
const preview=m=>m.deleted?'🚫 Message deleted':m.text||(isAudio(m.file)?'🎤 Voice note':m.file?'📎 Attachment':'');
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
document.addEventListener('click',()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()},{once:true});

async function authGo(kind){
  try{const d=await api(kind,{method:'POST',body:JSON.stringify({name:$('#name').value,number:$('#num').value,password:$('#pw').value})});
   token=d.token;localStorage.t=token;me=d.user;
   if(kind==='signup')alert('Your number is '+d.user.number+'. Share it so people can message you!');
   start();}catch(e){$('#err').textContent=e.message}
}
function logout(){localStorage.removeItem('t');location.reload()}
async function init(){if(!token)return;try{me=await api('me');start()}catch{localStorage.removeItem('t')}}
function start(){
  $('#auth').style.display='none';$('#app').style.display='grid';showMe();
  $('#emoji').innerHTML='😀 😂 🥹 😍 😘 😎 🤔 😅 😭 😡 👍 👎 🙏 👏 🙌 💪 🔥 ✨ 🎉 ❤️ 💔 😴 🤝 👀 🥳 😇 🤗 🙄 😬 🤯 🍕 ☕ 🎂 🚀 ✅ ❌'.split(' ').map(e=>`<span onclick="addEmoji('${e}')">${e}</span>`).join('');
  sock=io({auth:{token}});
  sock.on('message',m=>{
    if(msgs[m.chat])msgs[m.chat].push(m);
    if(cur===m.chat){renderMsgs();if(m.from!==me.number)sock.emit('read',{chat:cur})}
    if(m.from!==me.number)notifyMsg(m);
    loadChats();
  });
  sock.on('message-updated',m=>{const a=msgs[m.chat];if(a){const i=a.findIndex(x=>x.id===m.id);if(i>=0)a[i]=m}if(cur===m.chat)renderMsgs();loadChats()});
  sock.on('status',({id,chat,status})=>{const m=(msgs[chat]||[]).find(x=>x.id===id);if(m){m.status=status;if(cur===chat)renderMsgs()}loadChats()});
  sock.on('typing',({chat,name})=>{if(chat!==cur)return;$('#hsub').textContent=name+' is typing…';clearTimeout(typingTimer);typingTimer=setTimeout(setSub,1500)});
  sock.on('presence',p=>{pres[p.number]=p;setSub();loadChats()});
  sock.on('chats-changed',loadChats);callSockets();ice().catch(()=>{});
  loadChats();
}
function showMe(){$('#meAv').innerHTML=avHtml(me.name,me.avatar);$('#meName').textContent=me.name;$('#meNum').innerHTML='+'+esc(me.number)+' · <a href="#" onclick="logout()">log out</a>'}
function notifyMsg(m){
  if(!('Notification' in window)||Notification.permission!=='granted'||(!document.hidden&&cur===m.chat))return;
  new Notification(chatInfo(m.chat)?.name||'New message',{body:preview(m),icon:'/icon-192.png'});
}
async function loadChats(){chats=await api('chats');renderList();if(cur){setSub();const c=chatInfo(cur);if(c)$('#hav').innerHTML=avIn(c.name,c.avatar)}}
function renderList(){
  const q=$('#q').value.toLowerCase();
  const shown=chats.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.number||'').includes(q));
  $('#list').innerHTML=shown.map(c=>`<div class="chat ${c.id===cur?'on':''}" onclick="openChat('${c.id}')">
   <div class="av">${avIn(c.name,c.avatar)}</div>
   <div class="mid"><div><b>${esc(c.name)}</b></div><div class="sub">${c.last?(c.last.from===me.number?tick(c.last.status)+' ':'')+esc(preview(c.last)):'No messages yet'}</div></div>
   ${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>`).join('')||'<p class="sub" style="padding:16px">No chats yet. Tap “+ Chat” and enter a number.</p>';
}
function chatInfo(id){return chats.find(c=>c.id===id)}
function setSub(){
  const c=chatInfo(cur);if(!c)return;
  if(c.group){$('#hsub').textContent=c.members.map(n=>'+'+n).join(', ');return}
  const p=pres[c.number];
  $('#hsub').textContent=(p?p.online:c.online)?'online':p?.lastSeen?'last seen '+time(p.lastSeen):'+'+c.number;
}
async function openChat(id){
  cur=id;clearReply();$('#empty').style.display='none';$('#pane').style.display='flex';$('#app').classList.add('open');
  const c=chatInfo(id);$('#hname').textContent=c.name;$('#hav').innerHTML=avIn(c.name,c.avatar);$('#calls').style.display=c.group?'none':'';setSub();
  msgs[id]=await api('messages?chat='+encodeURIComponent(id));
  renderMsgs();sock.emit('read',{chat:id});
  c.unread=0;renderList();$('#txt').focus();
}
function closeChat(){cur=null;$('#app').classList.remove('open');$('#pane').style.display='none';$('#empty').style.display='';renderList()}
function renderMsgs(){
  const c=chatInfo(cur),box=$('#msgs'),list=msgs[cur]||[];let last='';
  box.innerHTML=list.map(m=>{
    const mine=m.from===me.number,d=new Date(m.ts).toDateString();
    const sep=d!==last?`<div class="day">${d===new Date().toDateString()?'Today':d}</div>`:'';last=d;
    if(m.deleted)return sep+`<div class="m del ${mine?'me':''}">🚫 This message was deleted<div class="t">${time(m.ts)}</div></div>`;
    const f=m.file?(isImg(m.file)?`<img class="pic" src="${esc(m.file.url)}">`:isAudio(m.file)?`<audio controls src="${esc(m.file.url)}"></audio>`:`<a href="${esc(m.file.url)}" target="_blank">📄 ${esc(m.file.name)}</a>`):'';
    const r=m.replyTo&&list.find(x=>x.id===m.replyTo);
    return sep+`<div class="m ${mine?'me':''}"><div class="act"><span onclick="setReply('${m.id}')">↩</span>${mine?`<span onclick="del('${m.id}')">🗑</span>`:''}</div>
     ${c?.group&&!mine?`<div class="who">+${esc(m.from)}</div>`:''}${r?`<div class="q">${esc(preview(r))}</div>`:''}${f}${m.text?`<div>${esc(m.text)}</div>`:''}
     <div class="t">${time(m.ts)} ${mine?tick(m.status):''}</div></div>`}).join('');
  box.scrollTop=box.scrollHeight;
}
function setReply(id){const m=msgs[cur].find(x=>x.id===id);replyId=id;$('#replytxt').textContent='↩ '+preview(m).slice(0,80);$('#replybar').style.display='flex';$('#txt').focus()}
function clearReply(){replyId=null;$('#replybar').style.display='none'}
function del(id){if(confirm('Delete this message for everyone?'))sock.emit('delete',{id})}
function toggleEmoji(){const e=$('#emoji');e.style.display=e.style.display==='flex'?'none':'flex'}
function addEmoji(e){$('#txt').value+=e;$('#txt').focus()}
function send(file){
  const text=$('#txt').value.trim();if(!cur||(!text&&!file))return;
  sock.emit('send',{chat:cur,text:file?'':text,file:file||null,replyTo:replyId},r=>{if(r?.error)alert(r.error)});
  $('#txt').value='';clearReply();$('#emoji').style.display='none';
}
async function uploadAndSend(f){
  const fd=new FormData();fd.append('file',f);
  try{const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});if(!r.ok)throw 0;send(await r.json())}catch{alert('Upload failed')}
}
async function sendFile(inp){const f=inp.files[0];if(f)await uploadAndSend(f);inp.value=''}
async function mic(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('#mic').textContent='🎤';
      const type=rec.mimeType||'audio/webm';uploadAndSend(new File([new Blob(chunks,{type})],'voice-note.'+(type.includes('mp4')?'m4a':'webm'),{type}))};
    rec.start();$('#mic').textContent='⏹️';
  }catch{alert('Microphone not available')}
}
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('#txt').addEventListener('input',()=>cur&&sock.emit('typing',{chat:cur}));
async function newChat(){
  const n=(prompt('Enter their number:')||'').replace(/\D/g,'');if(!n)return;
  if(n===me.number)return alert('That is your own number');
  try{const u=await api('users/'+n);const id=['dm',...[me.number,n].sort()].join(':');
   if(!chatInfo(id))chats.unshift({id,name:u.name,number:n,online:u.online,unread:0});openChat(id)}catch(e){alert(e.message)}
}
async function newGroup(){
  const name=prompt('Group name:');if(!name)return;
  const nums=(prompt('Member numbers, comma-separated:')||'').split(',').map(s=>s.trim()).filter(Boolean);
  try{const g=await api('groups',{method:'POST',body:JSON.stringify({name,members:nums})});await loadChats();openChat(g.id)}catch(e){alert(e.message)}
}
// ---------- avatars, profile, contact info ----------
const avIn=(n,u)=>u?`<img src="${esc(u)}" alt="">`:esc((n||'?')[0].toUpperCase());
const avHtml=(n,u,c='')=>`<div class="av ${c}">${avIn(n,u)}</div>`;
function openModal(html){$('#modal').innerHTML=`<div class="card">${html}</div>`;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function editProfile(){
  openModal(`<div style="text-align:center"><div onclick="$('#pfile').click()" style="cursor:pointer">${avHtml(me.name,me.avatar,'big')}</div>
   <button class="btn alt" onclick="$('#pfile').click()">Change photo</button> ${me.avatar?'<button class="btn alt" onclick="setAvatar(null)">Remove</button>':''}</div>
   <label class="sub">Name</label><input id="pname" value="${esc(me.name)}" maxlength="40">
   <label class="sub">About</label><input id="pabout" value="${esc(me.about||'')}" maxlength="140">
   <p class="sub">Your number: +${esc(me.number)}</p>
   <div class="row"><button class="btn" onclick="saveProfile()">Save</button><button class="btn alt" onclick="closeModal()">Close</button></div>
   <input type="file" id="pfile" accept="image/*" hidden onchange="pickAvatar(this)">`);
}
async function saveProfile(){
  try{me=await api('me',{method:'PUT',body:JSON.stringify({name:$('#pname').value.trim()||me.name,about:$('#pabout').value})});showMe();closeModal()}catch(e){toast(e.message)}
}
async function pickAvatar(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const bmp=await createImageBitmap(f),S=256,cv=document.createElement('canvas');cv.width=cv.height=S;
    const m=Math.min(bmp.width,bmp.height);
    cv.getContext('2d').drawImage(bmp,(bmp.width-m)/2,(bmp.height-m)/2,m,m,0,0,S,S);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    const fd=new FormData();fd.append('file',new File([blob],'avatar.jpg',{type:'image/jpeg'}));
    const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});if(!r.ok)throw 0;
    await setAvatar((await r.json()).url);
  }catch{toast('Could not use that photo')}
  inp.value='';
}
async function setAvatar(url){me=await api('me',{method:'PUT',body:JSON.stringify({avatar:url})});showMe();editProfile()}
async function showContact(){
  const c=chatInfo(cur);if(!c)return;
  if(c.group)return openModal(`<div style="text-align:center">${avHtml(c.name,null,'big')}<h3 style="margin:4px 0">${esc(c.name)}</h3></div><p class="sub">${c.members.length} members</p>${c.members.map(n=>`<div>+${esc(n)}</div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
  let u={};try{u=await api('users/'+c.number)}catch{}
  openModal(`<div style="text-align:center">${avHtml(c.name,u.avatar||c.avatar,'big')}<h3 style="margin:4px 0">${esc(c.name)}</h3><div class="sub">+${esc(c.number)}</div><p>${esc(u.about||'')}</p></div>
   <div class="row"><button class="btn" onclick="closeModal();startCall(false)">📞 Voice</button><button class="btn" onclick="closeModal();startCall(true)">🎥 Video</button></div>
   <div class="row" style="margin-top:8px"><button class="btn alt" onclick="closeModal()">Close</button></div>`);
}

// ---------- voice & video calls (WebRTC; signalling over Socket.IO) ----------
let pc,localStream,callPeer=null,callState='idle',callVideo=false,pendingIce=[],callTimer,durT,iceCfg,ringCtx,ringT;
const ice=async()=>iceCfg||(iceCfg=(await api('ice')).iceServers);
function ring(on){
  clearInterval(ringT);if(!on)return;
  const beep=()=>{try{ringCtx=ringCtx||new AudioContext();const o=ringCtx.createOscillator(),g=ringCtx.createGain();o.frequency.value=440;g.gain.value=.15;o.connect(g);g.connect(ringCtx.destination);o.start();o.stop(ringCtx.currentTime+.4)}catch{}if(navigator.vibrate)navigator.vibrate(300)};
  beep();ringT=setInterval(beep,1500);
}
function ui(incoming){
  $('#cacc').style.display=incoming?'':'none';
  $('#cmute').style.display=incoming?'none':'';
  $('#ccam').style.display=(!incoming&&callVideo)?'':'none';
}
function showCall(name,avatar,stat){
  $('#cav').innerHTML=avIn(name,avatar);$('#cname').textContent=name;$('#cstat').textContent=stat;
  $('#cmute').textContent='🎙️';$('#ccam').textContent='📷';
  $('#call').classList.remove('on');$('#call').classList.toggle('video',callVideo);$('#call').style.display='flex';
}
const media=video=>navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false});
async function startCall(video){
  const c=chatInfo(cur);if(!c||c.group||callState!=='idle')return;
  if(!navigator.mediaDevices?.getUserMedia)return toast('Calls need a secure (https) page and a supported browser');
  try{localStream=await media(video)}catch{return toast('Allow microphone'+(video?' and camera':'')+' access to call')}
  callPeer=c.number;callVideo=video;callState='calling';
  showCall(c.name,c.avatar,'Calling…');ui(false);$('#lv').srcObject=video?localStream:null;
  sock.emit('call:invite',{to:c.number,video},r=>{if(r?.error){endCall(null,r.error)}});
  callTimer=setTimeout(()=>{if(callState==='calling')endCall('call:end','No answer')},45000);
}
async function acceptCall(){
  ring(false);
  try{localStream=await media(callVideo)}catch{endCall('call:reject');return toast('Allow microphone'+(callVideo?' and camera':'')+' access to answer')}
  callState='connecting';ui(false);$('#cstat').textContent='Connecting…';$('#lv').srcObject=callVideo?localStream:null;
  sock.emit('call:accept',{to:callPeer});
}
const hangup=()=>endCall(callState==='ringing'?'call:reject':'call:end');
function endCall(evt,msg){
  clearTimeout(callTimer);clearInterval(durT);ring(false);
  if(evt&&callPeer)sock.emit(evt,{to:callPeer});
  try{pc&&pc.close()}catch{}pc=null;
  localStream&&localStream.getTracks().forEach(t=>t.stop());localStream=null;
  callPeer=null;callState='idle';pendingIce=[];
  $('#call').style.display='none';$('#rv').srcObject=null;$('#lv').srcObject=null;
  if(msg)toast(msg);
}
function toggleMute(b){const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;b.textContent=t.enabled?'🎙️':'🔇'}}
function toggleCam(b){const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;b.textContent=t.enabled?'📷':'🚫'}}
async function makePc(){
  const p=pc=new RTCPeerConnection({iceServers:await ice()});
  localStream.getTracks().forEach(t=>p.addTrack(t,localStream));
  p.onicecandidate=e=>{if(e.candidate&&callPeer)sock.emit('call:signal',{to:callPeer,data:{candidate:e.candidate}})};
  p.ontrack=e=>{$('#rv').srcObject=e.streams[0]};
  p.onconnectionstatechange=()=>{
    if(p!==pc)return;
    if(p.connectionState==='connected'&&callState!=='active'){
      callState='active';clearTimeout(callTimer);$('#call').classList.add('on');
      const t0=Date.now();durT=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#cstat').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
    }
    if(p.connectionState==='failed')endCall('call:end','Call failed. Your network may be blocking direct calls.');
  };
}
async function flushIce(){for(const c of pendingIce)await pc.addIceCandidate(c).catch(()=>{});pendingIce=[]}
function callSockets(){
  sock.on('call:incoming',({from,name,avatar,video})=>{
    if(callState!=='idle'){sock.emit('call:reject',{to:from});return}
    callPeer=from;callVideo=video;callState='ringing';
    showCall(name,avatar,video?'Incoming video call…':'Incoming voice call…');ui(true);ring(true);
  });
  sock.on('call:accepted',async({from})=>{
    if(from!==callPeer||callState!=='calling')return;
    clearTimeout(callTimer);callState='connecting';$('#cstat').textContent='Connecting…';
    try{await makePc();const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('call:signal',{to:callPeer,data:{sdp:pc.localDescription}})}catch{endCall('call:end','Could not start the call')}
  });
  sock.on('call:signal',async({from,data})=>{
    if(from!==callPeer)return;
    try{
      if(data.sdp&&data.sdp.type==='offer'){
        await makePc();await pc.setRemoteDescription(data.sdp);await flushIce();
        const a=await pc.createAnswer();await pc.setLocalDescription(a);
        sock.emit('call:signal',{to:callPeer,data:{sdp:pc.localDescription}});
      }else if(data.sdp){await pc.setRemoteDescription(data.sdp);await flushIce()}
      else if(data.candidate){if(pc&&pc.remoteDescription)await pc.addIceCandidate(data.candidate).catch(()=>{});else pendingIce.push(data.candidate)}
    }catch(e){console.error(e)}
  });
  sock.on('call:rejected',({from})=>{if(from===callPeer)endCall(null,'Call declined')});
  sock.on('call:ended',({from})=>{if(from===callPeer)endCall(null,callState==='ringing'?'Missed call':'Call ended')});
}
init();
